[project]
name = "olaisearch"
version = "0.1.0"
description = "Production-grade palm-leaf manuscript digitization and search platform"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",

    # AI/ML
    "torch>=2.1.0",
    "pytorch-lightning>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.35.0",
    "sentence-transformers>=2.2.0",
    "openai>=1.3.0",

    # OCR
    "pytesseract>=0.3.10",

    # CV and image processing
    "opencv-python>=4.8.0",
    "scikit-image>=0.22.0",
    "pillow>=10.1.0",
    "pdf2image>=1.16.0",

    # Search and retrieval
    "faiss-cpu>=1.7.4",

    # NLP
    "python-Levenshtein>=0.23.0",
    "fuzzywuzzy>=0.18.0",
    "grapheme>=0.6.0",

    # Task queue
    "celery>=5.3.0",
    "redis>=5.0.0",

    # Storage
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",

    # ML tracking
    "mlflow>=2.8.0",

    # Config
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",

    # Logging
    "structlog>=23.2.0",

    # Utilities
    "tenacity>=8.2.0",
    "httpx>=0.25.0",
    "tqdm>=4.66.0",
    "networkx>=3.2",
    "numpy>=1.24.0",
    "scipy>=1.11.0",

    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.11.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    "ipython>=8.17.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["tests*", "eval*", "scripts*", "frontend*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=backend --cov-report=html --cov-report=term"
